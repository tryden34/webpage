<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas HTML</title>
</head>
<body>
    <h1>Mi lista de cosas por hacer</h1>

        <li>Estudiar HTML</li>
        <li>Practicar programación</li>
    </ol>

    <h2>Lista desordenada</h2>

        <li>Pizza</li>
        <li>Helado</li>
        <li>Refresco</li>
    </ul>
</body>
</html>
